<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Bonumech Host</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Bonumech <em>Host</em></span>
    </div>
    <p class="tagline">Bu makineye uzaktan destek verilmesine izin verir.</p>

    <div class="cred">
      <div class="cred-row">
        <span class="cred-label">Sizin ID</span>
        <span id="id-value" class="cred-value">— — —</span>
      </div>
      <div class="cred-row">
        <span class="cred-label">Oturum Şifresi</span>
        <span id="pass-value" class="cred-value">— — —</span>
        <button id="new-pass" class="mini-btn" title="Yeni şifre üret">⟳</button>
      </div>
    </div>

    <div id="status" class="status">
      <span class="dot dot-wait"></span>
      <span id="status-text">Sunucuya bağlanılıyor…</span>
    </div>

    <p class="note">Destek veren kişiye yukarıdaki <strong>ID</strong> ve <strong>şifreyi</strong>
      iletin. Oturum sırasında bu pencereyi kapatabilirsiniz; uygulama sistem tepsisinde çalışmaya devam eder.</p>

    <!-- Ekran yakalama için gizli video (yayın kaynağı) -->
    <video id="local-preview" autoplay muted playsinline style="display:none"></video>
  </div>

  <script src="host.js"></script>
</body>
</html>
